<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Validation</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: inline-block; width: 140px; }
    .error { color: red; font-size: 0.9em; margin-left: 10px; }
    .success { color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Student Registration Form</h2>

  <form id="regForm" onsubmit="return validateForm()">
    <div class="form-group">
      <label>Student ID:</label>
      <input type="text" id="studentId" placeholder="e.g., S12345">
      <span class="error" id="idErr"></span>
    </div>

    <div class="form-group">
      <label>Student Name:</label>
      <input type="text" id="studentName" placeholder="e.g., John Doe">
      <span class="error" id="nameErr"></span>
    </div>

    <div class="form-group">
      <label>Email Address:</label>
      <input type="text" id="email" placeholder="e.g., user@domain.com">
      <span class="error" id="emailErr"></span>
    </div>

    <div class="form-group">
      <label>Mobile Number:</label>
      <input type="text" id="mobile" placeholder="e.g., 9876543210">
      <span class="error" id="mobileErr"></span>
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="password" placeholder="Min 8 chars, mixed">
      <span class="error" id="passErr"></span>
    </div>

    <button type="submit">Register</button>
  </form>

  <p class="success" id="successMsg"></p>

  <script>
    function validateForm() {
      // Clear previous error messages
      document.querySelectorAll('.error').forEach(el => el.innerText = '');
      document.getElementById('successMsg').innerText = '';

      let isValid = true;

      // 1. Student ID: "S" followed by exactly 5 digits
      const studentId = document.getElementById('studentId').value.trim();
      const idRegex = /^S\d{5}$/;
      if (!idRegex.test(studentId)) {
        document.getElementById('idErr').innerText = 'Must start with "S" followed by 5 digits (e.g. S12345)';
        isValid = false;
      }

      // 2. Student Name: Alphabets and spaces only, min length 5
      const studentName = document.getElementById('studentName').value.trim();
      const nameRegex = /^[A-Za-z\s]{5,}$/;
      if (!nameRegex.test(studentName)) {
        document.getElementById('nameErr').innerText = 'Only alphabets/spaces, minimum 5 characters';
        isValid = false;
      }

      // 3. Email: Standard format (username@domain.com)
      const email = document.getElementById('email').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        document.getElementById('emailErr').innerText = 'Invalid email address format';
        isValid = false;
      }

      // 4. Mobile Number: 10 digits starting with 6, 7, 8, or 9
      const mobile = document.getElementById('mobile').value.trim();
      const mobileRegex = /^[6-9]\d{9}$/;
      if (!mobileRegex.test(mobile)) {
        document.getElementById('mobileErr').innerText = 'Must be 10 digits starting with 6, 7, 8, or 9';
        isValid = false;
      }

      // 5. Password: Min 8 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special char
      const password = document.getElementById('password').value;
      const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^_\-~])[A-Za-z\d@$!%*?&#^_\-~]{8,}$/;
      if (!passRegex.test(password)) {
        document.getElementById('passErr').innerText = 'Min 8 chars: 1 upper, 1 lower, 1 digit, 1 special character';
        isValid = false;
      }

      if (isValid) {
        document.getElementById('successMsg').innerText = 'Registration successful!';
      }

      return false;
    }
  </script>

</body>
</html>
